.grid path{fill:#F0E5D1;stroke:#FDFBF8;stroke-width:1}
.isl circle{fill:#D4B57C}
.ring1,.ring2{fill:none;stroke:#C9A96E;stroke-width:.8}.ring1{opacity:.55}.ring2{opacity:.3}
text{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif}
.c1{font-size:16px;font-weight:700;fill:#1A1010;paint-order:stroke;stroke:#D4B57C;stroke-width:3px;stroke-linejoin:round}
.c2{font-size:13.5px;font-weight:700;fill:#3A2C2C;paint-order:stroke;stroke:#F0E5D1;stroke-width:3px;stroke-linejoin:round}
.cv{font-size:16px;font-weight:700;fill:#1A1010;paint-order:stroke;stroke:#FDFBF8;stroke-width:3px}
.mt{font-size:11px;letter-spacing:.18em;fill:#B3A79C}
.il{font-size:10.5px;fill:#8A7B70;font-style:italic}
.off .ring{fill:#FDFBF8;opacity:.85}.off .pin{fill:#8B1A2B}
.off text{font-size:11.5px;font-weight:700;fill:#1A1010;paint-order:stroke;stroke:#FDFBF8;stroke-width:3.5px;stroke-linejoin:round}
</style>
