<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 576" role="img" aria-labelledby="t d">
<title id="t">Where MiS works</title>
<desc id="d">Map of mainland Southeast Asia. Vietnam and Thailand are MiS's markets; Laos, Cambodia and Myanmar are highlighted for projects connected to the Vietnamese or Thai grid. MiS offices are in Nonthaburi, Thailand and Ho Chi Minh City, Vietnam.</desc>
<defs>
<radialGradient id="fg" cx="52%" cy="50%" r="58%"><stop offset="72%" stop-color="#fff"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fade"><rect width="600" height="576" fill="url(#fg)"/></mask>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#C9A96E" stop-opacity=".22"/><stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/></radialGradient>
</defs>
