<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} – MiS</title>
<meta name="description" content="{{ page.description | default: page.summary | strip_html | normalize_whitespace | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | escape }} – MiS">
<meta property="og:description" content="{{ page.description | default: page.summary | strip_html | normalize_whitespace | escape }}">
<meta property="og:image" content="{{ site.url }}{{ page.image | default: '/images/hero-wind-substation.jpg' }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta name="theme-color" content="#8B1A2B">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="alternate" type="application/rss+xml" title="MiS news" href="/feed.xml">
<script>document.documentElement.className += ' js';</script>
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
